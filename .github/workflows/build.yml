
name: Build TV Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tv-home-main.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project
        run: unzip -q tv-home-main.zip

      - name: Build APK
        run: |
          cd tv-home-main/launcher
          chmod +x build-and-install.sh
          ./build-and-install.sh --build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Haier-TV-Launcher
          path: tv-home-main/launcher/build/tvhome.apk
